  <link rel="stylesheet" href="styles.css">
  <meta http-equiv="refresh" content="0; url=pdf/menu-final.pdf">
  <script>
    // Redirect immediately to the PDF; fallback link remains visible if blocked.
    window.addEventListener("DOMContentLoaded", () => {
      const pdfUrl = "pdf/menu-final.pdf";
      try {
        window.location.replace(pdfUrl);
      } catch (e) {
        // ignore and leave fallback link
      }
    });
  </script>
</head>

    <section class="pdf-card" style="display:grid;place-items:center;text-align:center;padding:32px;">

      <p style="margin:0;font-size:16px;">If it doesn’t open automatically, <a href="pdf/menu-final.pdf">tap here</a>.</p>
    </section>
  </main>
