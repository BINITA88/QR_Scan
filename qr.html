  <script>
    const url = "https://qr-scan-livid.vercel.app/pdf/menu-final.pdf";
    const qrContainer = document.getElementById("qrcode");
    const qr = new QRCode(qrContainer, {
      text: url,
      width: 600,
      height: 600,
      correctLevel: QRCode.CorrectLevel.M,
    });

    function downloadPng() {
      const canvas = qrContainer.querySelector("canvas");
      if (!canvas) return alert("Canvas not ready; please wait a moment then try again.");
      const link = document.createElement("a");
      link.download = "qr-menu.png";
      link.href = canvas.toDataURL("image/png");
      link.click();
    }

    document.getElementById("downloadBtn").addEventListener("click", downloadPng);
    // Auto-download shortly after render for convenience
    setTimeout(downloadPng, 500);
  </script>
</body>
